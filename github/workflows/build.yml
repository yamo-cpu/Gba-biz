name: Build GBA
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4
      - name: Compila
        run: |
          export PATH=$PATH:/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin
          arm-none-eabi-gcc -specs=gba.specs -mthumb -mthumb-interwork -O2 source/main.c -o game.elf
          arm-none-eabi-objcopy -O binary game.elf game.gba
          gbafix game.gba || true
      - uses: actions/upload-artifact@v4
        with:
          name: rom
          path: game.gba
